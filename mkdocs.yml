site_name: EPML ITMO - Wine Quality Classification
site_description: Документация проекта машинного обучения для классификации качества вина
site_author: Anton Tikhonov
site_url: https://username.github.io/epml_itmo/

repo_name: epml_itmo
repo_url: https://github.com/username/epml_itmo

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ru
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Начало работы:
    - Установка: getting-started/installation.md
    - Быстрый старт: getting-started/quickstart.md
    - Конфигурация: getting-started/configuration.md
  - Руководства:
    - Подготовка данных: guides/data-preparation.md
    - Обучение моделей: guides/model-training.md
    - ClearML интеграция: guides/clearml-integration.md
    - Эксперименты: guides/experiments.md
  - API Reference:
    - Обзор: api/overview.md
    - Data: api/data.md
    - Models: api/models.md
    - Pipelines: api/pipelines.md
    - ClearML: api/clearml.md
  - Отчёты:
    - Результаты экспериментов: reports/experiments.md
    - Сравнение моделей: reports/model-comparison.md
  - Разработка:
    - Развёртывание: development/deployment.md
    - Воспроизводимость: development/reproducibility.md
    - Contributing: development/contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/username/epml_itmo
  generator: false

copyright: Copyright &copy; 2025 Anton Tikhonov - EPML ITMO Project

