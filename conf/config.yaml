# Main Hydra configuration file
# This file composes all sub-configurations

defaults:
  - model: random_forest
  - data: default
  - training: default
  - clearml: default
  - _self_

# MLflow configuration
mlflow:
  tracking_uri: "file://${hydra:runtime.cwd}/mlruns"
  experiment_name: "wine_quality_hydra"

# ClearML configuration (overridable)
clearml:
  enabled: true
  project_name: "EPML-ITMO/Wine-Quality"
  offline_mode: false

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Random seed for reproducibility
seed: 42

# Output directory for results
output_dir: "outputs"

