# Random Forest model configuration
name: "RandomForest"
_target_: "sklearn.ensemble.RandomForestClassifier"

# Model hyperparameters
params:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: "sqrt"
  bootstrap: true
  random_state: ${seed}
  n_jobs: -1
